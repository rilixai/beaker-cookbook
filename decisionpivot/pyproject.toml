[project]
name = "decisionpivot"
version = "0.1.0"
description = "A decision-model agent on DecisionPivot's core track: 13 families of contrast groups at an LLM system's control points."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["typesafe-sdk[zstd]==0.7.5", "openai>=2,<3", "pydantic>=2.11,<3"]

[project.scripts]
decisionpivot = "decisionpivot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decisionpivot"]

[dependency-groups]
dev = ["beaker-sdk>=0.6.5,<0.7", "ruff", "mypy", "pytest", "pytest-asyncio"]

[tool.ruff]
line-length = 119
extend-include = [".beaker/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["decisionpivot"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/decisionpivot", ".beaker/beaker_integration.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
