# Reasoning-model example. Reasoning models reject temperature/top_p/seed;
# the runner sends a `reasoning` effort instead and omits sampling params.
# NOTE: they are also non-deterministic — run N times and report mean ± var.
[model]
name = "gpt-5.6"  # GPT-5 / o-series names are auto-detected as reasoning models
reasoning_effort = "medium"  # none|minimal|low|medium|high|xhigh|max
api_type = "responses"
# max_output_tokens = 65536  # per-request cap; reasoning tokens count toward it
