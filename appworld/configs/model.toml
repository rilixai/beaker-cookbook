# One block per model, holding just the parameters that model supports.
# (Table names with dots must be quoted — TOML would otherwise nest them.)
# Pick one with `--model <name>` (or the `default` below). Whether a model is
# a reasoning model (gpt-5*/o-series) or a standard one is detected from its
# name, and only supported parameters get sent.
default = "gpt-5.6"

# Reasoning models (non-deterministic — run N times, report mean ± var):
["gpt-5.6"]
reasoning_effort = "medium"  # none|minimal|low|medium|high|xhigh|max
# max_output_tokens = 65536  # per-request cap; reasoning tokens count toward it

# Standard models:
["gpt-4.1"]
temperature = 0.0
# top_p = 1.0
# max_output_tokens = 16384

["gpt-4o"]
temperature = 0.0
