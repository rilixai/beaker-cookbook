# One block per model. Pick one with `--model <name>` (default: `default`).
# Reasoning models (gpt-5*/gpt-6*/o-series) take `reasoning_effort`; standard models
# take `temperature`/`top_p`. All values below are the defaults, written out.
default = "gpt-6-luna"

["gpt-6-luna"]
reasoning_effort = "low"
max_output_tokens = 65536

["gpt-5.6-sol"]
reasoning_effort = "medium"  # none | minimal | low | medium | high | xhigh | max
max_output_tokens = 65536    # per-request cap; reasoning tokens count toward it

["gpt-5-mini"]
reasoning_effort = "medium"
max_output_tokens = 65536

["gpt-4.1"]
temperature = 0.0            # 0.0 = deterministic-ish; sampling starts > 0
top_p = 1.0                  # nucleus sampling; leave at 1.0 unless sweeping
max_output_tokens = 16384

["gpt-4o"]
temperature = 0.0
top_p = 1.0
max_output_tokens = 16384

# Open-weight models on other OpenAI-compatible endpoints. The provider picks
# sampling defaults; reasoning effort goes in `extra_body`, in each provider's shape.
# These match the "high" effort Beaker's hosted runs used for these models.

["youcom-deepseek-v4.1-flash"]  # You.com Inference Router
model = "deepseek-v4.1-flash"
base_url = "https://api.you.com/v1"
api_key_env = "YDC_API_KEY"
extra_body = { reasoning_effort = "high" }

["youcom-glm-5.3-flash"]
model = "glm-5.3-flash"
base_url = "https://api.you.com/v1"
api_key_env = "YDC_API_KEY"
extra_body = { reasoning_effort = "high" }

["openrouter-deepseek-v4.1-flash"]  # OpenRouter
model = "deepseek/deepseek-v4.1-flash"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
extra_body = { reasoning = { effort = "high" } }

["openrouter-glm-5.3-flash"]
model = "z-ai/glm-5.3-flash"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
extra_body = { reasoning = { effort = "high" } }
