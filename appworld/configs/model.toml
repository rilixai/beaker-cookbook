# One block per model. Pick one with `--model <name>` (default: `default`).
# Reasoning models (gpt-5*/o-series) take `reasoning_effort`; standard models
# take `temperature`/`top_p`. All values below are the defaults, written out.
default = "gpt-5.6"

["gpt-5.6"]
reasoning_effort = "medium"  # none | minimal | low | medium | high | xhigh | max
max_output_tokens = 65536    # per-request cap; reasoning tokens count toward it

["gpt-4.1"]
temperature = 0.0            # 0.0 = deterministic-ish; sampling starts > 0
top_p = 1.0                  # nucleus sampling; leave at 1.0 unless sweeping
max_output_tokens = 16384

["gpt-4o"]
temperature = 0.0
top_p = 1.0
max_output_tokens = 16384
