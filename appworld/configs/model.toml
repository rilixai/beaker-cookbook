# Model config. Change `name` to sweep models — whether it's a reasoning
# model (gpt-5*/o-series) or a standard one is detected from the name, and
# only the parameters that model supports get sent.
[model]
name = "gpt-5.6"

# Reasoning models only (non-deterministic — run N times, report mean ± var):
reasoning_effort = "medium"  # none|minimal|low|medium|high|xhigh|max

# Standard models only (e.g. name = "gpt-4.1" or "gpt-4o"):
# temperature = 0.0
# top_p = 1.0

# Uncomment to override the per-request output-token cap (reasoning tokens
# count toward it; defaults: 65536 reasoning, 16384 standard):
# max_output_tokens = 65536

# Escape hatch if name-based detection guesses wrong for a new model:
# family = "reasoning"  # or "standard"
