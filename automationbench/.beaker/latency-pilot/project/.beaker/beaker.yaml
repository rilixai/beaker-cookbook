default_integration: automationbench-latency-h20
config_defaults:
  max_concurrency: 32
  case_retry_limit: 2
  test_baseline: false
  harness_optimization:
    optimization_goal: latency
    baseline_repeats: 3
integrations:
  automationbench-latency-h20:
    entrypoint: beaker_integration:integration
    source_dir: automationbench/.beaker/latency-pilot/project
    package_import_root: .beaker
    environment_base: "debian_slim:3.13"
    agent_key: automationbench-skills
