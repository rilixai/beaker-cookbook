# Beaker project config. Safe to commit — holds no secrets.
# `spec` owns the local @spec entrypoint used by GitHub-backed spec builds and
# `beaker run smoke`. Run-time flags override values here when provided.
spec:
  target: "beaker_spec:build_spec"
  source_dir: "automationbench"
  package_import_root: ".beaker"
  environment_base: "debian_slim:3.13"
  # List required customer variable names here; keep values in .beaker/.env
  # locally and in encrypted Beaker agent settings for hosted runs.
  required_env:
    - OPENAI_API_KEY
agent_key: "automationbench-skills"
# `config_defaults` below holds the launch defaults for hosted runs, and only
# this top-level mapping is read: a key nested under `spec` is ignored.
# Dataset selection lives here as well —
#   dataset_ref: my-dataset          # hosted revision, `name` or `name@revision`
#   dataset_id: <artifact_id>        # one artifact id instead of a name
#   local_dataset_path: beaker_dataset  # local directory, for `beaker run smoke`
# Logical-target specs using `@spec(repository=None)` can map complete optimized
# prompts/resources to repository paths. Repository optimization does not need
# these mappings because its candidate is already a repository diff.
# config_defaults:
#   repository_destinations:
#     - target_kind: resource
#       target_name: wiki
#       repository_path: docs/wiki
#     - target_kind: prompt
#       target_name: system
#       repository_path: prompts/system.md
config_defaults:
  dataset_ref: "automationbench-skills-pilot@155d600b3fcbe1c0fbb96816f3eaddde1a26f41abdccf9e843ff183937890c13"
