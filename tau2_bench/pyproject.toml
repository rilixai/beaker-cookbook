[project]
name = "tau2-bench-recipe"
version = "0.1.0"
description = "A customer-service agent on tau2-bench (airline, retail) with an editable prompt and agent loop."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  # The benchmark itself (domains, user simulator, orchestrator, evaluator).
  # Beaker installs the vendored package alongside this recipe via pip_install_from.
  "tau2==2.0.0",
  "pydantic>=2.11,<3",
  "openai>=1.99,<3",
  # Traces the agent's and simulator's model calls on every run.
  "beaker-sdk>=0.6.5,<0.7",
]

[project.scripts]
tau2-bench = "tau2_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tau2_bench"]

[tool.uv.sources]
tau2 = { path = "vendor/tau2" }

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "pytest-asyncio"]

[tool.ruff]
line-length = 119
extend-include = [".beaker/*.py"]
extend-exclude = ["vendor/tau2"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/tau2_bench/data.py" = ["E501"]  # pinned SHA-256 table

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["tau2_bench"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/tau2_bench", ".beaker/beaker_integration.py"]

# tau2 ships without type information.
[[tool.mypy.overrides]]
module = ["tau2", "tau2.*"]
ignore_missing_imports = true

# The agent and simulator subclass tau2's (untyped) base classes.
[[tool.mypy.overrides]]
module = ["tau2_bench.agent", "tau2_bench.user_sim"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
