[project]
name = "harvey-lab"
version = "0.1.0"
description = "GEPA-optimized, Stirrup-harnessed legal agent on Harvey's Legal Agent Benchmark (LAB)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "rilixai" }]
dependencies = [
  # NOTE: temporary git+url pin while rilixai is not yet published to
  # PyPI at the needed version. SSH URL (not HTTPS) so CI auth flows
  # through ``RILIXAI_GITHUB_SSH_KEY`` via webfactory's ssh-agent action.
  "rilixai @ git+ssh://git@github.com/rilixai/rilixai.git@28ea6f1380b30e65a85232c312fed9ac088baa86#subdirectory=packages/rilixai",
  # Stirrup — Artificial Analysis' agent harness the LAB-AA leaderboard
  # runs on; supplies the tool-use loop + LLM routing. The litellm extra
  # pulls in the multi-provider client the task model is routed through.
  "stirrup[litellm]>=0.1.12",
  "litellm>=1.74",
  # litellm lazy-imports tenacity for its retry wrapper but doesn't declare
  # it; the baked sandbox image has nothing else pulling it in, so pin it.
  "tenacity>=8.0",
  # The agent's structured verdict models use pydantic directly. rilixai
  # dropped its transitive pydantic dep at v0.2.2, so declare it explicitly.
  "pydantic>=2,<3",
  # Heavy document parsers — lazy-imported inside the workspace read surface
  # so hermetic tests (fixture text files) don't pay the import cost.
  "openpyxl>=3.1",
  "pypdf>=4.0",
  "python-docx>=1.1",
]

[dependency-groups]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src-layout: the importable package is ``src/harvey_lab``. Dev/test/script
# assets live at the project root (outside ``src``) and are excluded from
# the wheel by construction.
packages = ["src/harvey_lab"]

[tool.hatch.metadata]
# Allow the ``rilixai @ git+ssh://...`` direct reference in
# ``project.dependencies`` until the cookbook can swap to a PyPI version pin.
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 119

[tool.ruff.lint]
ignore = ["C901", "E501", "E721", "E741", "F402", "F823"]
select = ["C", "E", "F", "I", "W", "UP006", "UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
show_error_codes = true
files = ["src/harvey_lab"]

[[tool.mypy.overrides]]
module = [
  "stirrup",
  "stirrup.*",
  "openpyxl",
]
ignore_missing_imports = true
