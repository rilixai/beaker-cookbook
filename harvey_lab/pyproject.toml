[project]
name = "harvey-lab"
version = "0.1.0"
description = "A Stirrup-harnessed legal agent on Harvey's Legal Agent Benchmark (LAB), with local rubric evaluation."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "rilixai" }]
dependencies = [
  # Stirrup — Artificial Analysis' agent harness the LAB-AA leaderboard
  # runs on; supplies the tool-use loop + LLM routing. The litellm extra
  # pulls in the multi-provider client the task model is routed through.
  "stirrup[litellm]>=0.1.12",
  "litellm>=1.74",
  # litellm lazy-imports tenacity for its retry wrapper but doesn't declare it.
  "tenacity>=8.0",
  # The agent's structured tool-parameter models use pydantic directly.
  "pydantic>=2,<3",
  # Heavy document parsers — lazy-imported inside the workspace read surface
  # so hermetic tests (fixture text files) don't pay the import cost.
  "openpyxl>=3.1",
  "pypdf>=4.0",
  "python-docx>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The package is the workspace member directory itself. Remap so
# everything under "." installs at the top-level ``harvey_lab`` import
# path; exclude dev/test/script assets from the wheel.
sources = { "." = "harvey_lab" }
# Editable installs add the repo root (not this dir) to sys.path so the
# package resolves under its ``harvey_lab`` import name from anywhere,
# including a ``cd harvey_lab`` shell.
dev-mode-dirs = [".."]
include = [
  "__init__.py",
  "*.py",
  "agent/**/*.py",
  "data/**/*.py",
  "evaluation/**/*.py",
  # Frozen train/val/test task-id lists loaded at runtime by data.read_split.
  "splits/*.txt",
]
exclude = [
  "tests/**",
  "scripts/**",
  "pyproject.toml",
  "README.md",
]

# Dev tooling + lint/type/test config live in this recipe's own pyproject so
# the folder is a self-contained project.

[dependency-groups]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ``importlib`` import mode + the repo root on ``sys.path`` (``..``) so the
# recipe imports as the top-level ``harvey_lab`` package (how the tests
# reference it) regardless of how pytest is launched.
addopts = "--import-mode=importlib"
pythonpath = [".."]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
ignore = ["C901", "E501", "E721", "E741", "F402", "F823"]
select = ["C", "E", "F", "I", "W", "UP006", "UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["harvey_lab"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
show_error_codes = true
# Flat layout: the package dir IS this recipe folder. Point mypy at it via the
# parent so modules resolve as ``harvey_lab.…`` and intra-package imports
# type-check. Tests + scripts are excluded (fixture-shaped types).
files = ["../harvey_lab"]
exclude = ["(^|/)tests/", "(^|/)scripts/"]

# ``ignore_missing_imports`` for the agent/parser deps that ship without
# ``py.typed`` markers.
[[tool.mypy.overrides]]
module = [
  "stirrup",
  "stirrup.*",
  "litellm",
  "openpyxl",
  "docx",
]
ignore_missing_imports = true
