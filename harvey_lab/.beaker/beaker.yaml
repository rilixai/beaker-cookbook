# Paths are relative to the Git root; package_import_root is relative to source_dir.
default_integration: harvey-lab
integrations:
  harvey-lab:
    entrypoint: beaker_integration:integration
    source_dir: harvey_lab
    package_import_root: .beaker
    agent_key: harvey-lab-agent
    requires_scorer_model: true
    scorer_model: openrouter:deepseek/deepseek-v4-flash
    environment_base: debian_slim:3.12
    apt_install:
      - pandoc
      - poppler-utils
      - libreoffice
