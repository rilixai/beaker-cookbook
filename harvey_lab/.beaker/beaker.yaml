# Beaker project config. Safe to commit — holds no secrets.
# `spec` owns the local @spec entrypoint used by GitHub-backed spec builds and
# `beaker run dry-run`. Run-time flags override values here when provided.
spec:
  target: "beaker_spec:build_spec"
  source_dir: "."
  package_import_root: ".beaker"
# Matches the existing hosted optimization target "Harvey LAB" (key: harvey-lab).
# Confirmed during setup against `beaker agent list` / org agent discovery.
agent_key: "harvey-lab"
config_defaults:
  # Harvey LAB rollouts are expensive (long tool loops + rubric judge).
  # Keep the optimizer budget modest until a wider run is intentional.
  max_metric_calls: 20
