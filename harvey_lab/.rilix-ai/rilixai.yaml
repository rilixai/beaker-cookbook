# RilixAI project config. Safe to commit — holds no secrets.
# `spec` owns the local @spec entrypoint used by GitHub-backed spec builds and
# `rilixai run dry-run`. Run-time flags override values here when provided.
spec:
  name: "harvey-lab"
  target: "rilixai_spec:build_spec"
  task_type: "harvey-lab"
  source_dir: "."
  package_import_root: ".rilix-ai"
scope_key: "harvey-lab"
agent_key: "harvey-lab"
config_defaults:
  # Local scaffold dataset used only by `rilixai run dry-run`.
  # For `rilixai run trigger`, pass --dataset or set dataset_ref.
  local_dataset_path: ".rilix-ai/dataset"
  # Spend cap: maximum metric/evaluation calls the optimizer may make.
  max_metric_calls: 50
