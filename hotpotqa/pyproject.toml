[project]
name = "hotpotqa"
version = "0.1.0"
description = "GEPA-optimized PydanticAI agent on the HotpotQA multi-hop QA task."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "rilixai" }]
dependencies = [
  # NOTE: temporary git+url pin while rilixai is not yet published to
  # PyPI at the needed version. SSH URL (not HTTPS) so CI auth flows
  # through ``RILIXAI_GITHUB_SSH_KEY`` via webfactory's ssh-agent action.
  "rilixai @ git+ssh://git@github.com/rilixai/rilixai.git@28ea6f1380b30e65a85232c312fed9ac088baa86#subdirectory=packages/rilixai",
  "pydantic-ai>=0.0.20",
  "rank-bm25>=0.2",
  "datasets>=2.14",
  "bm25s>=0.2",
  "PyStemmer>=2.2",
  "ujson>=5",
  "huggingface-hub>=0.20",
]

[dependency-groups]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src-layout: the importable package is ``src/hotpotqa``. Dev/test/script
# assets live at the project root (outside ``src``) and are excluded from
# the wheel by construction.
packages = ["src/hotpotqa"]

[tool.hatch.metadata]
# Allow the ``rilixai @ git+ssh://...`` direct reference in
# ``project.dependencies`` until the cookbook can swap to a PyPI version pin.
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 119

[tool.ruff.lint]
ignore = ["C901", "E501", "E721", "E741", "F402", "F823"]
select = ["C", "E", "F", "I", "W", "UP006", "UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
show_error_codes = true
files = ["src/hotpotqa"]

[[tool.mypy.overrides]]
module = [
  "rank_bm25",
  "datasets",
  "bm25s",
  "Stemmer",
]
ignore_missing_imports = true
