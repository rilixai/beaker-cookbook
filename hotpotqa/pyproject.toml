[project]
name = "hotpotqa"
version = "0.1.0"
description = "GEPA-optimized PydanticAI agent on the HotpotQA multi-hop QA task."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "rilixai" }]
dependencies = [
  # NOTE: temporary git+url pin while rilixai is not yet published to
  # PyPI at the needed version. Once a fresh rilixai is published,
  # swap this to ``rilixai==X.Y.Z`` plus a matching
  # ``[[tool.uv.index]]`` block + ``[tool.uv.sources]`` mapping.
  # Pinned to the SDK-redesign branch (feat/sdk-redesign-pr1): brings
  # the easy-mode adapters (BaseCaseRunner + ComponentApplier),
  # rilixai.metrics (BaseMetricsCalculator + FieldConfig + the
  # llm_judge comparator), and the class-style @spec.
  # SSH URL (not HTTPS) so CI auth flows through
  # ``RILIXAI_GITHUB_SSH_KEY`` via webfactory's ssh-agent action.
  "rilixai @ git+ssh://git@github.com/rilixai/rilixai.git@305f72e1851595132eed543ad3037dc4eed4d2f0",
  "pydantic-ai>=0.0.20",
  "rank-bm25>=0.2",
  "datasets>=2.14",
  "bm25s>=0.2",
  "PyStemmer>=2.2",
  "ujson>=5",
  "huggingface-hub>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Consumed by `rilixai push --member hotpotqa` (CI) + `rilixai trigger`:
# the spec target (the @spec-decorated runner) + the run task type. The
# member's deps (above) are auto-discovered, so no per-member sandbox.py.
[tool.rilixai.spec]
name = "hotpotqa-agent"
target = "hotpotqa/rilixai_spec.py"
task_type = "hotpotqa_pydantic_agent"

[tool.hatch.build.targets.wheel]
# The package is the workspace member directory itself. Remap so
# everything under "." installs at the top-level ``hotpotqa`` import
# path; exclude dev/test/script assets from the wheel.
sources = { "." = "hotpotqa" }
include = [
  "__init__.py",
  "*.py",
  "agent/**/*.py",
  "data/**/*.py",
]
exclude = [
  "tests/**",
  "pyproject.toml",
  "README.md",
]

[tool.hatch.metadata]
# Allow the ``rilixai @ git+https://…`` direct reference in
# ``project.dependencies`` until the cookbook can swap to a PyPI
# version pin.
allow-direct-references = true
