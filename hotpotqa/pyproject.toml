[project]
name = "hotpotqa"
version = "0.1.0"
description = "A PydanticAI tool-using agent on the HotpotQA multi-hop QA task, with local evaluation."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "rilixai" }]
dependencies = [
  # The agent loop, its tools, and the structured answer terminator.
  "pydantic-ai>=0.0.20",
  # Retrieval: rank-bm25 over a case's distractor paragraphs, bm25s (+
  # PyStemmer, ujson) over the fullwiki abstracts dump.
  "rank-bm25>=0.2",
  "datasets>=2.14",
  "bm25s>=0.2",
  "PyStemmer>=2.2",
  "ujson>=5",
  "huggingface-hub>=0.20",
]

[project.scripts]
hotpotqa = "hotpotqa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Standard src layout: the importable package lives at ``src/hotpotqa``.
[tool.hatch.build.targets.wheel]
packages = ["src/hotpotqa"]

# Dev tooling + lint/type/test config live in this project's own pyproject so
# the folder is self-contained.

[dependency-groups]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 119

[tool.ruff.lint]
ignore = ["C901", "E501", "E721", "E741", "F402", "F823"]
select = ["C", "E", "F", "I", "W", "UP006", "UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["hotpotqa"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
show_error_codes = true
files = ["src/hotpotqa"]

# ``ignore_missing_imports`` for the scientific deps that ship without
# ``py.typed`` markers.
[[tool.mypy.overrides]]
module = [
  "rank_bm25",
  "datasets",
  "bm25s",
  "Stemmer",
]
ignore_missing_imports = true
