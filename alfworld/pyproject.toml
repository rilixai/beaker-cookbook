[project]
name = "alfworld-agent"
version = "0.1.0"
description = "A household agent on ALFWorld that picks every action with a decision model."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  # Text-only: no [full] or [vis] extras, so no THOR, torch or GPU.
  "alfworld==0.4.2",
  "textworld[pddl]==1.7.0",
  "typesafe-sdk[zstd]==0.7.5",
  "openai>=2,<3",
  "pydantic>=2.11,<3",
]

[project.scripts]
alfworld-agent = "alfworld_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alfworld_agent"]

[dependency-groups]
dev = ["beaker-sdk>=0.6.5,<0.7", "ruff", "mypy", "pytest", "pytest-asyncio"]

[tool.ruff]
line-length = 119
extend-include = [".beaker/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["alfworld_agent"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/alfworld_agent", ".beaker/beaker_integration.py"]

# ALFWorld and TextWorld ship without type information.
[[tool.mypy.overrides]]
module = ["alfworld", "alfworld.*", "textworld", "textworld.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
