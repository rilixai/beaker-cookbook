default_integration: alfworld
integrations:
  alfworld:
    agent_key: alfworld
    entrypoint: beaker_integration:integration
    source_dir: alfworld
    package_import_root: .beaker
    environment_base: debian_slim:3.12
    # textworld[pddl] builds Fast Downward from source (sdist only on PyPI).
    apt_install:
      - cmake
      - g++
      - make
