[project]
name = "toolathlon-baseline"
version = "0.1.0"
description = "Run Toolathlon's original baseline on all 108 tasks, with a native quickstart option."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyyaml==6.0.2"]

[project.scripts]
toolathlon-baseline = "toolathlon_baseline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolathlon_baseline"]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "types-PyYAML",
    "pytest",
    "beaker-sdk[tracing]>=0.6.6",
]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/toolathlon_baseline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
