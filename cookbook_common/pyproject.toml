[project]
name = "cookbook-common"
version = "0.1.0"
description = "Shared, recipe-agnostic helpers for the rilixai cookbook benchmark recipes."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "rilixai" }]
dependencies = [
  # NOTE: temporary git+url pin while rilixai is not yet published to
  # PyPI at the needed version — kept in lockstep with the recipe
  # members so a single rilixai build is resolved for the whole
  # workspace. SSH URL (not HTTPS) so CI auth flows through
  # ``RILIXAI_GITHUB_SSH_KEY`` via webfactory's ssh-agent action.
  "rilixai @ git+ssh://git@github.com/rilixai/rilixai.git@424a3f0fd1259e25ad4754fde744e653519e54b3#subdirectory=packages/rilixai",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The package is the workspace member directory itself. Remap so
# everything under "." installs at the top-level ``cookbook_common``
# import path; exclude dev/test/script assets from the wheel.
sources = { "." = "cookbook_common" }
include = [
  "__init__.py",
  "*.py",
]
exclude = [
  "tests/**",
  "pyproject.toml",
  "README.md",
]

[tool.hatch.metadata]
# Allow the ``rilixai @ git+ssh://...`` direct reference in
# ``project.dependencies`` until the cookbook can swap to a PyPI
# version pin.
allow-direct-references = true
