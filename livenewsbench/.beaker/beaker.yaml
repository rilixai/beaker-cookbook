# Beaker configuration. Safe to commit; keep secret values out of this file.
# YDC_API_KEY is a You.com API key: keep it in .beaker/.env locally and in the
# agent's encrypted settings for hosted runs. LIVENEWSBENCH_MODEL (optional)
# picks the Inference Router model; it defaults to deepseek-v4.1-flash.
default_integration: livenewsbench
integrations:
  livenewsbench:
    agent_key: livenewsbench
    entrypoint: beaker_integration:integration
    source_dir: livenewsbench
    package_import_root: .beaker
    environment_base: debian_slim:3.12
    required_env: [YDC_API_KEY]
    scorer_model: openai:gpt-4.1
