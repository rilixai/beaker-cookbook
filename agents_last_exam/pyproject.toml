[project]
name = "agents-last-exam-recipe"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2.10", "pyyaml>=6", "requests>=2.32", "filelock>=3.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_last_exam"]

[dependency-groups]
dev = ["beaker-sdk==0.6.8", "ruff", "mypy", "types-requests", "types-PyYAML"]

[tool.ruff]
line-length = 119
extend-include = [".beaker/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/agents_last_exam", ".beaker"]
