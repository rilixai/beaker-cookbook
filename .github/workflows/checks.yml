name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      # The rilixai dep is currently a git+url pin to the private
      # rilixai/rilixai repo. Provide a PAT with read access so
      # uv sync can fetch it.
      - name: Configure git for private rilixai access
        env:
          GH_PAT: ${{ secrets.RILIXAI_REPO_READ_PAT }}
        run: |
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"

      - name: uv sync
        run: uv sync --all-packages --group dev

      - name: ruff check
        run: uv run ruff check

      - name: ruff format check
        run: uv run ruff format --check

      - name: mypy
        # ``[tool.mypy] files`` in pyproject.toml scopes this to each
        # workspace member's source dir (tests + scripts are excluded
        # to match the rilixai pattern).
        run: uv run python -m mypy

      - name: pytest
        run: uv run python -m pytest -q
