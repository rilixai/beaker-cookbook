name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Lint, format, type-check, and verify the hotpotqa workspace member
  # builds cleanly. Split from the pytest job so a lint regression
  # fails fast without waiting for pytest, and vice versa (mirrors
  # rilixai's split between ``checks.yml`` and ``tests.yml``).
  checks:
    name: Lint, type-check, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python
        run: uv python install

      # The rilixai dep is a ``git+ssh://`` pin to the private
      # rilixai/rilixai repo. Auth flows via a deploy-key-style SSH
      # private key in ``RILIXAI_GITHUB_SSH_KEY`` — matches the rilix
      # repo's auth pattern (see rilix/.github/workflows/push-spec.yml).
      - name: Configure SSH for private rilixai dependency
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.RILIXAI_GITHUB_SSH_KEY }}

      - name: Trust GitHub SSH host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      # ``--locked`` fails the job if uv.lock is stale vs pyproject —
      # catches "forgot to ``uv lock`` after editing pyproject" before
      # it bites downstream consumers of the cookbook template.
      - name: uv sync (locked)
        run: uv sync --all-packages --group dev --locked

      - name: ruff check
        run: uv run ruff check

      - name: ruff format check
        run: uv run ruff format --check

      - name: mypy
        # ``[tool.mypy] files`` in pyproject.toml scopes this to each
        # workspace member's source dir (tests + scripts are excluded
        # to match the rilixai pattern).
        run: uv run python -m mypy

      # Build each workspace member's wheel without
      # ``[tool.uv.sources]`` overrides so packaging regressions
      # surface here rather than in a downstream "copy this template"
      # user's environment.
      - name: Build hotpotqa distribution
        run: uv build --package hotpotqa --no-sources

      - name: Build apex_agents distribution
        run: uv build --package apex-agents --no-sources

      - name: Build harvey_lab distribution
        run: uv build --package harvey-lab --no-sources

  tests:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python
        run: uv python install

      - name: Configure SSH for private rilixai dependency
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.RILIXAI_GITHUB_SSH_KEY }}

      - name: Trust GitHub SSH host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: uv sync (locked)
        run: uv sync --all-packages --group dev --locked

      - name: pytest
        run: uv run python -m pytest -q
