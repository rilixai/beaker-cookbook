name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Lint, format, type-check, and verify each recipe builds cleanly. Each
  # recipe is its own standalone uv project (its own pyproject + uv.lock), so
  # the matrix runs the checks independently per recipe directory. Split from
  # the pytest job so a lint regression fails fast without waiting for pytest,
  # and vice versa (mirrors rilixai's split between ``checks.yml`` and
  # ``tests.yml``).
  checks:
    name: Lint, type-check, and build (${{ matrix.recipe }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        recipe: [harvey_lab, hotpotqa, apex_agents]
    defaults:
      run:
        working-directory: ${{ matrix.recipe }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python
        run: uv python install

      # hotpotqa + apex_agents still depend on the private rilixai/rilixai
      # repo via a ``git+ssh://`` pin; auth flows via a deploy-key-style SSH
      # private key in ``RILIXAI_GITHUB_SSH_KEY``. harvey_lab is standalone
      # (no rilixai dependency), so it skips the SSH setup entirely.
      - name: Configure SSH for private rilixai dependency
        if: matrix.recipe != 'harvey_lab'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.RILIXAI_GITHUB_SSH_KEY }}

      - name: Trust GitHub SSH host
        if: matrix.recipe != 'harvey_lab'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      # ``--locked`` fails the job if this recipe's uv.lock is stale vs its
      # pyproject — catches "forgot to ``uv lock`` after editing pyproject"
      # before it bites a downstream consumer of the cookbook template.
      - name: uv sync (locked)
        run: uv sync --group dev --locked

      - name: ruff check
        run: uv run ruff check

      - name: ruff format check
        run: uv run ruff format --check

      - name: mypy
        # ``[tool.mypy] files`` in this recipe's pyproject.toml scopes this to
        # the recipe's source (tests + scripts excluded).
        run: uv run python -m mypy

      # Build the recipe's wheel without ``[tool.uv.sources]`` overrides so
      # packaging regressions surface here rather than in a downstream "copy
      # this template" user's environment.
      - name: Build distribution
        run: uv build --no-sources

  tests:
    name: Pytest (${{ matrix.recipe }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        recipe: [harvey_lab, hotpotqa, apex_agents]
    defaults:
      run:
        working-directory: ${{ matrix.recipe }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python
        run: uv python install

      - name: Configure SSH for private rilixai dependency
        if: matrix.recipe != 'harvey_lab'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.RILIXAI_GITHUB_SSH_KEY }}

      - name: Trust GitHub SSH host
        if: matrix.recipe != 'harvey_lab'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: uv sync (locked)
        run: uv sync --group dev --locked

      - name: pytest
        run: uv run python -m pytest -q
