name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      # The rilixai dep is a ``git+ssh://`` pin to the private
      # rilixai/rilixai repo. Auth flows via a deploy-key-style SSH
      # private key in ``RILIXAI_GITHUB_SSH_KEY`` — matches the rilix
      # repo's auth pattern (see rilix/.github/workflows/push-spec.yml).
      - name: Configure SSH for private rilixai dependency
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.RILIXAI_GITHUB_SSH_KEY }}

      - name: Trust GitHub SSH host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: uv sync
        run: uv sync --all-packages --group dev

      - name: ruff check
        run: uv run ruff check

      - name: ruff format check
        run: uv run ruff format --check

      - name: mypy
        # ``[tool.mypy] files`` in pyproject.toml scopes this to each
        # workspace member's source dir (tests + scripts are excluded
        # to match the rilixai pattern).
        run: uv run python -m mypy

      - name: pytest
        run: uv run python -m pytest -q
