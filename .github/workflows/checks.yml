name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Pin for recipes without a ``.python-version``; recipes that have one
  # (e.g. harvey_lab, pinned to 3.12) keep their own interpreter.
  DEFAULT_PYTHON: "3.14.8"

jobs:
  # Lint, format, type-check, and verify each recipe builds cleanly. Each
  # recipe is its own standalone uv project (its own pyproject + uv.lock), so
  # the matrix runs the checks independently per recipe directory. Split from
  # the pytest job so a lint regression fails fast without waiting for pytest,
  # and vice versa.
  checks:
    name: Lint, type-check, and build (${{ matrix.recipe }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        recipe: [harvey_lab, hotpotqa, apex_agents, appworld, automationbench]
    defaults:
      run:
        working-directory: ${{ matrix.recipe }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python
        run: |
          if [ ! -f .python-version ]; then
            echo "UV_PYTHON=$DEFAULT_PYTHON" >> "$GITHUB_ENV"
            export UV_PYTHON="$DEFAULT_PYTHON"
          fi
          uv python install

      # ``--locked`` fails the job if this recipe's uv.lock is stale vs its
      # pyproject — catches "forgot to ``uv lock`` after editing pyproject"
      # before it bites a downstream consumer of the cookbook template.
      - name: uv sync (locked)
        run: uv sync --group dev --locked

      - name: ruff check
        run: uv run ruff check

      - name: ruff format check
        run: uv run ruff format --check

      - name: mypy
        # ``[tool.mypy] files`` in this recipe's pyproject.toml scopes this to
        # the recipe's source (tests + scripts excluded).
        run: uv run python -m mypy

      # Build the recipe's wheel without ``[tool.uv.sources]`` overrides so
      # packaging regressions surface here rather than in a downstream "copy
      # this template" user's environment.
      - name: Build distribution
        run: uv build --no-sources

  tests:
    name: Pytest (${{ matrix.recipe }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        recipe: [harvey_lab, hotpotqa, apex_agents, appworld, automationbench]
    defaults:
      run:
        working-directory: ${{ matrix.recipe }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python
        run: |
          if [ ! -f .python-version ]; then
            echo "UV_PYTHON=$DEFAULT_PYTHON" >> "$GITHUB_ENV"
            export UV_PYTHON="$DEFAULT_PYTHON"
          fi
          uv python install

      - name: uv sync (locked)
        run: uv sync --group dev --locked

      - name: pytest
        run: uv run python -m pytest -q
