name: Push specs to rilixai

# Auto-pushes each cookbook member's ``@spec``-decorated factory to the
# rilixai control plane on every merge to ``main``. Mirrors the rilix repo's
# ``push-spec.yml`` pattern (https://github.com/rilixai/rilix/pull/1381):
# rilixai's build worker materializes a Modal image from the source bundle,
# then ``rilixai spec promote`` flips ``<name>@production`` to the
# freshly-pushed version. Triggers referencing ``@production`` (the
# cookbook's default) pick it up immediately, with no per-merge edits.
#
# Push + promote happen via ``<member>/sandbox.py --build --no-trigger``
# (default version: ``v<short_sha>`` from git; promote: on; trigger: skipped
# — CI never spends LLM tokens on a smoke run).
#
# Per-recipe triggering: ``dorny/paths-filter`` decides which recipe's tree
# changed and the matrix only runs that recipe's push. A change under
# ``hotpotqa/**`` only rebuilds ``hotpotqa-agent``; a change under
# ``apex_agents/**`` only rebuilds ``apex-agents``. An edit to this workflow
# affects every recipe's push, so it fans out to all of them. ``fail-fast:
# false`` keeps one recipe's build failure from cancelling the others. Manual
# ``workflow_dispatch`` always fans out to every recipe (override the
# version label or skip the promote step for hot-fix re-pushes).

on:
  push:
    branches: [main]
    paths:
      - 'hotpotqa/**'
      - 'apex_agents/**'
      - '.github/workflows/push-spec.yml'
  workflow_dispatch:
    inputs:
      version_override:
        description: "Override the spec version label (default: v<short sha>)."
        required: false
        type: string
      skip_promote:
        description: "Push without promoting (the new build stays addressable but does not flip @production)."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Detect which recipes changed so the matrix only runs the ones that need a
  # fresh image. An edit to this workflow cascades to every recipe; manual
  # dispatch always fans out to every recipe.
  detect-changes:
    name: Detect changed recipes
    runs-on: ubuntu-latest
    outputs:
      members: ${{ steps.select.outputs.members }}
    steps:
      - uses: actions/checkout@v4

      - name: Path filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            hotpotqa:
              - 'hotpotqa/**'
            apex_agents:
              - 'apex_agents/**'
            root:
              - '.github/workflows/push-spec.yml'

      - name: Select members
        id: select
        # Each selected entry pairs a recipe directory (``dir``) with
        # the rilixai agent key it pushes to (``agent``). The build path runs
        # ``rilixai push`` / ``rilixai spec promote``, which resolve the agent
        # from ``$RILIXAI_AGENT_KEY`` (set per entry in the push job), so a
        # member is always pushed + promoted to *its own* agent.
        env:
          EVENT_NAME: ${{ github.event_name }}
          ROOT_CHANGED: ${{ steps.filter.outputs.root }}
          HOTPOTQA_CHANGED: ${{ steps.filter.outputs.hotpotqa }}
          APEX_CHANGED: ${{ steps.filter.outputs.apex_agents }}
        run: |
          set -euo pipefail
          HOTPOTQA='{"dir":"hotpotqa","agent":"hotpotqa-agent"}'
          APEX='{"dir":"apex_agents","agent":"apex-agents"}'
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] || [ "${ROOT_CHANGED}" = "true" ]; then
            MEMBERS=$(jq -c -n --argjson h "$HOTPOTQA" --argjson a "$APEX" '[$h, $a]')
          else
            MEMBERS='[]'
            [ "${HOTPOTQA_CHANGED}" = "true" ] && MEMBERS=$(echo "$MEMBERS" | jq -c --argjson h "$HOTPOTQA" '. + [$h]')
            [ "${APEX_CHANGED}" = "true" ] && MEMBERS=$(echo "$MEMBERS" | jq -c --argjson a "$APEX" '. + [$a]')
          fi
          echo "members=$MEMBERS" >> "$GITHUB_OUTPUT"
          echo "selected: $MEMBERS"

  push-spec:
    name: push ${{ matrix.entry.dir }}
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.members != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.detect-changes.outputs.members) }}
    # Serialize per member + ref so two rapid merges don't race the
    # ``rilixai spec promote`` order (which would otherwise leave
    # ``<name>@production`` pointing at whichever ``spec promote`` lost the
    # race rather than the more recent commit). Different members don't
    # block each other.
    concurrency:
      group: push-spec-${{ matrix.entry.dir }}-${{ github.ref }}
      cancel-in-progress: false
    # Each recipe is a standalone uv project; run ``uv`` from its directory.
    defaults:
      run:
        working-directory: ${{ matrix.entry.dir }}
    env:
      RILIXAI_API_BASE_URL: ${{ secrets.RILIXAI_API_BASE_URL }}
      RILIXAI_API_KEY: ${{ secrets.RILIXAI_API_KEY }}
      # ``rilixai push`` / ``spec promote`` resolve the target agent from this
      # (flag > $RILIXAI_AGENT_KEY > rilixai.yaml). One agent per member.
      RILIXAI_AGENT_KEY: ${{ matrix.entry.agent }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need the short SHA for the default version label.
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python
        run: uv python install

      - name: Configure SSH for private rilixai dependency
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.RILIXAI_GITHUB_SSH_KEY }}

      - name: Trust GitHub SSH host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: uv sync (locked)
        run: uv sync --group dev --locked

      - name: Push + promote spec
        # ``sandbox.py --build --no-trigger`` runs ``rilixai push`` with the
        # deps from this recipe's pyproject and then ``rilixai spec promote``
        # to point ``<name>@production`` at the fresh row. ``--no-trigger``
        # keeps CI build-only — optimization runs are initiated explicitly by
        # humans (or downstream services) against ``<name>@production``, never
        # auto-fired on every merge. Runs from the recipe dir (see the job's
        # ``working-directory`` default) so ``uv run`` uses this recipe's
        # standalone project.
        run: |
          VERSION_OVERRIDE_FLAG=""
          if [ -n "${VERSION_OVERRIDE}" ]; then
            VERSION_OVERRIDE_FLAG="--version ${VERSION_OVERRIDE}"
            echo "Using workflow_dispatch override: --version ${VERSION_OVERRIDE}"
          else
            echo "No override; sandbox.py defaults to v\$(git rev-parse --short HEAD)"
          fi
          SKIP_PROMOTE_FLAG=""
          if [ "${SKIP_PROMOTE}" = "true" ]; then
            SKIP_PROMOTE_FLAG="--no-promote"
            echo "workflow_dispatch requested --no-promote (build won't flip @production)"
          fi
          uv run sandbox.py --build --no-trigger ${VERSION_OVERRIDE_FLAG} ${SKIP_PROMOTE_FLAG}
        env:
          VERSION_OVERRIDE: ${{ inputs.version_override }}
          SKIP_PROMOTE: ${{ inputs.skip_promote }}
