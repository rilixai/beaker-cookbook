[project]
name = "rilixai-cookbook"
version = "0.1.0"
description = "Reproducible GEPA benchmark recipes for the rilixai optimizer."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "rilixai" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
# Workspace root has no runtime deps of its own — each benchmark
# workspace member declares its own deps (including the rilixai pin).
dependencies = []

[dependency-groups]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "pytest-asyncio>=0.23",
]

# Cookbook is a uv workspace. Each benchmark folder is a workspace
# member with its own pyproject.toml. ``uv sync`` installs all
# members in editable mode, so ``import hotpotqa.dataset`` works
# without sys.path hacks and per-benchmark deps stay isolated.
[tool.uv.workspace]
members = ["hotpotqa", "apex_agents", "harvey_lab", "cookbook_common"]
# As benchmarks migrate, add: "cl_bench"

# ``cookbook_common`` is a shared internal member the recipes depend on;
# resolve it from the workspace (editable) rather than an index.
[tool.uv.sources]
cookbook-common = { workspace = true }

# The workspace root isn't an installable Python package for local dev
# — uv installs each member from its own pyproject (``package = false``).
[tool.uv]
package = false

# ...but rilixai's sandbox build worker bakes the Modal image by running
# ``pip install /spec`` against this root (the whole cookbook is the
# bundle). Without a declared backend, pip falls back to setuptools'
# flat-layout auto-discovery, which refuses a tree containing more than
# one top-level package ("Multiple top-level packages discovered in a
# flat-layout: ['hotpotqa', 'apex_agents']"). Declare the backend and an
# explicit package list so the build is deterministic: every member's
# spec image installs all members (each spec only imports its own
# package; the others ride along harmlessly), with tests/scripts excluded.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hotpotqa*", "apex_agents*", "harvey_lab*", "cookbook_common*"]
exclude = ["*.tests", "*.tests.*", "*.scripts", "*.scripts.*"]

[tool.pytest.ini_options]
# Test discovery walks into each workspace member's tests/ dir.
testpaths = ["hotpotqa/tests", "apex_agents/tests", "harvey_lab/tests"]
# ``importlib`` import mode lets workspace members share test
# filenames (both have ``test_units.py`` / ``test_agent.py``) without
# the "module already imported under a different __file__" collision
# that pytest's default ``prepend`` mode raises.
addopts = "--import-mode=importlib"
# Put the repo root on ``sys.path`` so the workspace members
# (``hotpotqa`` / ``apex_agents`` / ``cookbook_common``) import as
# top-level packages regardless of how pytest is launched. The uv
# editable installs remap each member dir onto its import name, which
# resolves under ``python -m`` (cwd on path) but not the bare
# ``pytest`` console script; this makes discovery deterministic.
pythonpath = ["."]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
ignore = ["C901", "E501", "E721", "E741", "F402", "F823"]
select = ["C", "E", "F", "I", "W", "UP006", "UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
show_error_codes = true

# Scope mypy to benchmark source code; tests follow the same pattern
# as the rilixai repo (mypy runs over the package only, not tests or
# scripts, since the tests use fixture-shaped types that intentionally
# bend strict typing).
files = ["hotpotqa", "apex_agents", "harvey_lab", "cookbook_common"]
exclude = ["hotpotqa/tests/", "hotpotqa/scripts/", "apex_agents/tests/", "apex_agents/scripts/", "harvey_lab/tests/", "harvey_lab/scripts/"]

# Mirror the rilixai-side ``ignore_missing_imports`` overrides for
# the scientific deps that ship without ``py.typed`` markers.
[[tool.mypy.overrides]]
module = [
  "rank_bm25",
  "datasets",
  "bm25s",
  "Stemmer",
  "openpyxl",
  "xlrd",
  "stirrup",
  "stirrup.*",
]
ignore_missing_imports = true
