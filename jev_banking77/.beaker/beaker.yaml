default_integration: jev-banking77
integrations:
  jev-banking77:
    entrypoint: beaker_integration:integration
    source_dir: jev_banking77
    package_import_root: .beaker
    environment_base: debian_slim:3.12
    # A new gateway can satisfy this through server-confirmed TypeSafe routing.
    # Older deployments need a customer key; never assume routing is enabled.
    required_env:
      - TYPESAFE_API_KEY
