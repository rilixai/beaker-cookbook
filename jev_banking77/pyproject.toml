[project]
name = "jev-banking77"
version = "0.1.0"
description = "Native Jev intent routing on the frozen BANKING77 benchmark."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["typesafe-sdk[zstd]==0.7.5", "pydantic>=2.11,<3"]

[project.scripts]
jev-banking77 = "jev_banking77.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_banking77"]

[dependency-groups]
dev = ["beaker-sdk>=0.6.5,<0.7", "ruff", "mypy", "pytest", "pytest-asyncio"]

[tool.ruff]
line-length = 119
extend-include = [".beaker/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/jev_banking77", ".beaker/beaker_integration.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
