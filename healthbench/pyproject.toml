[project]
name = "healthbench"
version = "0.1.0"
description = "A health-conversation agent on OpenAI's HealthBench, graded rubric criterion by criterion by an LLM judge."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "rilixai" }]
dependencies = [
  # Both the agent and the rubric judge are plain chat-completions calls, so
  # any OpenAI-compatible endpoint (OpenAI, OpenRouter, a local server) works.
  "openai>=1.50",
  # Downloads the HealthBench JSONL from OpenAI's public blob store.
  "httpx>=0.27",
]

[project.scripts]
healthbench = "healthbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/healthbench"]

[dependency-groups]
dev = [
  "ruff",
  "mypy",
  "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 119

[tool.ruff.lint]
ignore = ["C901", "E501", "E721", "E741", "F402", "F823"]
select = ["C", "E", "F", "I", "W", "UP006", "UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["healthbench"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
show_error_codes = true
files = ["src/healthbench"]
