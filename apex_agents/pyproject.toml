[project]
name = "apex-agents"
version = "0.1.0"
description = "GEPA-optimized ReAct toolbelt agent on the Mercor APEX-Agents (Law / IB) benchmark."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "rilixai" }]
dependencies = [
  # NOTE: temporary git+url pin while rilixai is not yet published to
  # PyPI at the needed version. SSH URL (not HTTPS) so CI auth flows
  # through ``RILIXAI_GITHUB_SSH_KEY`` via webfactory's ssh-agent action.
  "rilixai @ git+ssh://git@github.com/rilixai/rilixai.git@28ea6f1380b30e65a85232c312fed9ac088baa86#subdirectory=packages/rilixai",
  "litellm>=1.74",
  # litellm lazy-imports tenacity for its retry wrapper but doesn't
  # declare it as a dependency. Locally a transitive dep provides it,
  # but the baked sandbox image has nothing pulling it in, so the
  # rubric judge call fails with "tenacity import failed". Pin it
  # explicitly so the image always has it.
  "tenacity>=8.0",
  "huggingface-hub>=0.20",
  # Heavy parsers — lazy-imported inside the WorldFiles surface so
  # tests with FakeWorld don't pay the import cost.
  "openpyxl>=3.1",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "xlrd>=2.0",
]

[dependency-groups]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src-layout: the importable package is ``src/apex_agents``. Dev/test/script
# assets live at the project root (outside ``src``) and are excluded from
# the wheel by construction.
packages = ["src/apex_agents"]

[tool.hatch.metadata]
# Allow the ``rilixai @ git+ssh://...`` direct reference in
# ``project.dependencies`` until the cookbook can swap to a PyPI version pin.
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 119

[tool.ruff.lint]
ignore = ["C901", "E501", "E721", "E741", "F402", "F823"]
select = ["C", "E", "F", "I", "W", "UP006", "UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
show_error_codes = true
files = ["src/apex_agents"]

[[tool.mypy.overrides]]
module = [
  "openpyxl",
  "xlrd",
]
ignore_missing_imports = true
