[project]
name = "apex-agents"
version = "0.1.0"
description = "A ReAct toolbelt agent on the Mercor APEX-Agents (Law / IB) benchmark, plus a local rubric evaluation."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "rilixai" }]
dependencies = [
  "litellm>=1.74",
  # litellm lazy-imports tenacity for its retry wrapper but doesn't
  # declare it as a dependency. A transitive dep usually provides it,
  # but on a minimal image nothing pulls it in and the rubric judge
  # call fails with "tenacity import failed". Pin it explicitly.
  "tenacity>=8.0",
  "huggingface-hub>=0.20",
  # Heavy parsers — lazy-imported inside the WorldFiles surface so
  # tests with FakeWorld don't pay the import cost.
  "openpyxl>=3.1",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "xlrd>=2.0",
]

[project.scripts]
apex-agents = "apex_agents.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Standard src layout: the importable package lives at ``src/apex_agents``.
[tool.hatch.build.targets.wheel]
packages = ["src/apex_agents"]

# Dev tooling + lint/type/test config live in this recipe's own pyproject so
# the folder is a self-contained project (no root workspace pyproject).

[dependency-groups]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 119

[tool.ruff.lint]
ignore = ["C901", "E501", "E721", "E741", "F402", "F823"]
select = ["C", "E", "F", "I", "W", "UP006", "UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["apex_agents"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
show_error_codes = true
files = ["src/apex_agents"]

# ``ignore_missing_imports`` for the parser/agent deps that ship without
# ``py.typed`` markers.
[[tool.mypy.overrides]]
module = [
  "litellm",
  "openpyxl",
  "xlrd",
]
ignore_missing_imports = true
