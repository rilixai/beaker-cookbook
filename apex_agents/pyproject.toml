[project]
name = "apex-agents"
version = "0.1.0"
description = "GEPA-optimized ReAct toolbelt agent on the Mercor APEX-Agents (Law / IB) benchmark."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "rilixai" }]
dependencies = [
  # NOTE: temporary git+url pin while rilixai is not yet published to
  # PyPI at the needed version. Once a fresh rilixai is published,
  # swap this to ``rilixai==X.Y.Z`` plus a matching
  # ``[[tool.uv.index]]`` block + ``[tool.uv.sources]`` mapping.
  # Pinned to the SDK-redesign branch (feat/sdk-redesign-pr1): brings
  # the easy-mode adapters (BaseCaseRunner + ComponentApplier),
  # rilixai.metrics (BaseMetricsCalculator + FieldConfig + the
  # llm_judge comparator), and the class-style @spec.
  # SSH URL (not HTTPS) so CI auth flows through
  # ``RILIXAI_GITHUB_SSH_KEY`` via webfactory's ssh-agent action —
  # matches the rilix repo's auth pattern.
  "rilixai @ git+ssh://git@github.com/rilixai/rilixai.git@aea6e360e036d737704941f18592726e20e8be40",
  "litellm>=1.74",
  # litellm lazy-imports tenacity for its retry wrapper but doesn't
  # declare it as a dependency. Locally a transitive dep provides it,
  # but the baked sandbox image has nothing pulling it in, so the
  # rubric judge call fails with "tenacity import failed". Pin it
  # explicitly so the image always has it.
  "tenacity>=8.0",
  "huggingface-hub>=0.20",
  # Heavy parsers — lazy-imported inside the WorldFiles surface so
  # tests with FakeWorld don't pay the import cost.
  "openpyxl>=3.1",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "xlrd>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Consumed by `rilixai push --member apex_agents` (CI) + `rilixai trigger`.
[tool.rilixai.spec]
name = "apex-agents"
target = "apex_agents/rilixai_spec.py"
task_type = "apex_agent"

[tool.hatch.build.targets.wheel]
# The package is the workspace member directory itself. Remap so
# everything under "." installs at the top-level ``apex_agents``
# import path; exclude dev/test/script assets from the wheel.
sources = { "." = "apex_agents" }
include = [
  "__init__.py",
  "*.py",
  "agent/**/*.py",
  "data/**/*.py",
]
exclude = [
  "tests/**",
  "pyproject.toml",
  "README.md",
]

[tool.hatch.metadata]
# Allow the ``rilixai @ git+ssh://...`` direct reference in
# ``project.dependencies`` until the cookbook can swap to a PyPI
# version pin.
allow-direct-references = true
