[project]
name = "apex-agents"
version = "0.1.0"
description = "A ReAct toolbelt agent on the Mercor APEX-Agents (Law / IB) benchmark, plus a local rubric evaluation."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "rilixai" }]
dependencies = [
  "litellm>=1.74",
  # litellm lazy-imports tenacity for its retry wrapper but doesn't
  # declare it as a dependency. A transitive dep usually provides it,
  # but on a minimal image nothing pulls it in and the rubric judge
  # call fails with "tenacity import failed". Pin it explicitly.
  "tenacity>=8.0",
  "huggingface-hub>=0.20",
  # Heavy parsers — lazy-imported inside the WorldFiles surface so
  # tests with FakeWorld don't pay the import cost.
  "openpyxl>=3.1",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "xlrd>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The package is the workspace member directory itself. Remap so
# everything under "." installs at the top-level ``apex_agents``
# import path; exclude dev/test/script assets from the wheel.
sources = { "." = "apex_agents" }
# Editable installs add the repo root (not this dir) to sys.path so the
# package resolves under its ``apex_agents`` import name from anywhere,
# including a ``cd apex_agents`` shell.
dev-mode-dirs = [".."]
include = [
  "__init__.py",
  "*.py",
  "agent/**/*.py",
  "data/**/*.py",
  "evaluation/**/*.py",
]
exclude = [
  "tests/**",
  "scripts/**",
  "pyproject.toml",
  "README.md",
]

# Dev tooling + lint/type/test config live in this recipe's own pyproject so
# the folder is a self-contained project (no root workspace pyproject).

[dependency-groups]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ``importlib`` import mode + the repo root on ``sys.path`` (``..``) so the
# recipe imports as the top-level ``apex_agents`` package (how the tests
# reference it, incl. ``apex_agents.tests.fake_world``) regardless of how
# pytest is launched.
addopts = "--import-mode=importlib"
pythonpath = [".."]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
ignore = ["C901", "E501", "E721", "E741", "F402", "F823"]
select = ["C", "E", "F", "I", "W", "UP006", "UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["apex_agents"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
show_error_codes = true
# Flat layout: the package dir IS this recipe folder. Point mypy at it via the
# parent so modules resolve as ``apex_agents.…`` and intra-package imports
# type-check. Tests + scripts are excluded (fixture-shaped types).
files = ["../apex_agents"]
exclude = ["(^|/)tests/", "(^|/)scripts/"]

# ``ignore_missing_imports`` for the parser/agent deps that ship without
# ``py.typed`` markers (mirrors the rilixai-side overrides).
[[tool.mypy.overrides]]
module = [
  "litellm",
  "openpyxl",
  "xlrd",
]
ignore_missing_imports = true
